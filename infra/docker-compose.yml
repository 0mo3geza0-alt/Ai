version: "3.9"
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  backend:
    build: { context: .., dockerfile: infra/Dockerfile.backend }
    environment:
      MONGO_URL: "mongodb://mongo:27017"
      DB_NAME: "agent_platform"
      CORS_ORIGINS: "*"
    ports: ["8001:8001"]
    depends_on: [mongo]
  frontend:
    build: { context: .., dockerfile: infra/Dockerfile.frontend }
    ports: ["3000:80"]
    depends_on: [backend]
volumes:
  mongo_data:
